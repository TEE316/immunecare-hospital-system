# ============================================================
# IMMUNECARE - APPLICATION CONFIGURATION
# ============================================================

# Spring Application Name
spring.application.name=immunecare-backend
server.port=8080
server.servlet.context-path=/api

# ============================================================
# DATABASE CONFIGURATION (MySQL 8.0)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/immunecare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================================
# SECURITY CONFIGURATION
# ============================================================
jwt.secret.key=ImmuneCareSecretKey2024VaccinationRecordSystemWithHigherSecurityStandards
jwt.expiration.time=86400000
jwt.refresh.expiration=604800000

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.immunecare=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
# SESSION & INACTIVITY
# ============================================================
server.servlet.session.timeout=30m
spring.session.timeout=1800s

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================================
# JACKSON JSON CONFIGURATION
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true